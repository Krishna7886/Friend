    // OFFICIAL JQUERY WATER RIPPLE BACKGROUND COMPONENT WITH MOUSE MOVEMENT RIPPLES
    function JQueryWaterRipple() {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;
        const $el = window.$(containerRef.current);

        try {
          if ($el && $el.ripples) {
            // Initialize jQuery Ripples WebGL plugin
            $el.ripples({
              resolution: 512,
              dropRadius: 22,
              perturbance: 0.04,
              interactive: true
            });

            // Smooth throttled mousemove / touchmove listener for ripples on mouse movement
            let lastMoveTime = 0;

            const handlePointerMove = (e) => {
              const now = Date.now();
              // Trigger ripple every 40ms during mouse movement for continuous liquid flow
              if (now - lastMoveTime > 40) {
                lastMoveTime = now;
                const clientX = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY);
                
                if (clientX !== undefined && clientY !== undefined) {
                  try {
                    $el.ripples('drop', clientX, clientY, 14 + Math.random() * 8, 0.02 + Math.random() * 0.015);
                  } catch (err) {}
                }
              }
            };

            const handlePointerDown = (e) => {
              const clientX = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX);
              const clientY = e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY);
              if (clientX !== undefined && clientY !== undefined) {
                try {
                  $el.ripples('drop', clientX, clientY, 26 + Math.random() * 10, 0.05 + Math.random() * 0.02);
                } catch (err) {}
              }
            };

            // Global event listeners capture mouse movement anywhere on screen
            window.addEventListener('mousemove', handlePointerMove);
            window.addEventListener('touchmove', handlePointerMove);
            window.addEventListener('mousedown', handlePointerDown);
            window.addEventListener('touchstart', handlePointerDown);

            // Ambient random raindrops in the background water pond
            const interval = setInterval(() => {
              if ($el && $el.ripples) {
                const rx = Math.random() * window.innerWidth;
                const ry = Math.random() * window.innerHeight;
                try {
                  $el.ripples('drop', rx, ry, 18 + Math.random() * 15, 0.025 + Math.random() * 0.02);
                } catch (e) {}
              }
            }, 2200);

            return () => {
              clearInterval(interval);
              window.removeEventListener('mousemove', handlePointerMove);
              window.removeEventListener('touchmove', handlePointerMove);
              window.removeEventListener('mousedown', handlePointerDown);
              window.removeEventListener('touchstart', handlePointerDown);
              try {
                if ($el && $el.ripples) $el.ripples('destroy');
              } catch (e) {}
            };
          }
        } catch (err) {
          console.log('WebGL ripples initialization note:', err);
        }
      }, []);

      return (
        <div 
          ref={containerRef} 
          id="jquery-water-ripple-container"
          style={{
            backgroundImage: `linear-gradient(135deg, rgba(26,2,11,0.85), rgba(76,5,25,0.75), rgba(24,1,8,0.9)), url("https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1600&auto=format&fit=crop")`
          }}
        />
      );
    }

    // FLOATING ROSE PETALS OVERLAY CANVAS
    function FloatingRosePetals() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const petals = Array.from({ length: 26 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          size: 8 + Math.random() * 12,
          speedY: 0.3 + Math.random() * 0.6,
          speedX: Math.sin(Math.random() * Math.PI) * 0.4,
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 0.8,
          opacity: 0.5 + Math.random() * 0.4
        }));

        let time = 0;
        const render = () => {
          time += 0.02;
          ctx.clearRect(0, 0, width, height);

          petals.forEach((p) => {
            p.y += p.speedY;
            p.x += Math.sin(time + p.y * 0.01) * p.speedX;
            p.rotation += p.rotSpeed;

            if (p.y > height + 20) {
              p.y = -20;
              p.x = Math.random() * width;
            }

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-p.size, -p.size, -p.size * 1.5, p.size / 2, 0, p.size * 1.5);
            ctx.bezierCurveTo(p.size * 1.5, p.size / 2, p.size, -p.size, 0, 0);
            ctx.fillStyle = `rgba(244, 63, 94, ${p.opacity})`;
            ctx.shadowColor = 'rgba(190, 18, 60, 0.4)';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.restore();
          });

          animId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', handleResize);
        };
      }, []);

      return <canvas ref={canvasRef} id="petals-canvas" />;
    }

    // UPGRADED ATTRACTIVE ROMANTIC MUSIC PLAYER COMPONENT
    function RomanticAudioPlayer({ songs, currentSongIndex, setCurrentSongIndex }) {
      const audioRef = useRef(null);
      const [isPlaying, setIsPlaying] = useState(false);
      const [progress, setProgress] = useState(0);
      const [duration, setDuration] = useState(0);

      const currentSong = songs[currentSongIndex] || {
        title: 'Soundarya & Krishna Romantic Theme',
        artist: 'Acoustic Love Melody',
        url: 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112199.mp3'
      };

      const togglePlay = () => {
        if (!audioRef.current) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          audioRef.current.play().then(() => setIsPlaying(true)).catch(e => console.log('Playback error:', e));
        }
      };

      const handleTimeUpdate = () => {
        if (!audioRef.current) return;
        setProgress(audioRef.current.currentTime);
        setDuration(audioRef.current.duration || 0);
      };

      const handleSeek = (e) => {
        if (!audioRef.current) return;
        const newTime = (e.target.value / 100) * duration;
        audioRef.current.currentTime = newTime;
        setProgress(newTime);
      };

      const playNext = () => {
        if (songs.length === 0) return;
        const nextIndex = (currentSongIndex + 1) % songs.length;
        setCurrentSongIndex(nextIndex);
        setIsPlaying(true);
      };

      const playPrev = () => {
        if (songs.length === 0) return;
        const prevIndex = (currentSongIndex - 1 + songs.length) % songs.length;
        setCurrentSongIndex(prevIndex);
        setIsPlaying(true);
      };

      useEffect(() => {
        if (audioRef.current && isPlaying) {
          audioRef.current.play().catch(e => console.log('Auto play note:', e));
        }
      }, [currentSongIndex]);

      const formatTime = (secs) => {
        if (isNaN(secs)) return '0:00';
        const mins = Math.floor(secs / 60);
        const remainder = Math.floor(secs % 60);
        return `${mins}:${remainder < 10 ? '0' : ''}${remainder}`;
      };

      return (
        <div className="glossy-panel rounded-3xl p-5 md:p-7 text-white max-w-xl mx-auto shadow-[0_15px_40px_rgba(244,63,94,0.35)] relative overflow-hidden border border-rose-400/40">
          <audio 
            ref={audioRef} 
            src={currentSong.url} 
            onTimeUpdate={handleTimeUpdate}
            onEnded={playNext}
            crossOrigin="anonymous"
          />

              <div className={`w-full h-full rounded-full bg-[radial-gradient(circle,#1a1a1a_30%,#000_70%)] flex items-center justify-center border-4 border-slate-900 ${isPlaying ? 'animate-spin-slow' : ''}`}>
                <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-rose-500 to-amber-400 flex items-center justify-center text-xs shadow-inner">
                  💖
                </div>
              </div>
            </div>

            <div className="flex-1 min-w-0 text-left">
              <span className="text-[10px] font-extrabold tracking-widest text-rose-300 uppercase block mb-1">
                🎵 Playing Soundarya's Melody
              </span>
              <h4 className="font-serif font-bold text-lg md:text-xl text-white truncate drop-shadow-md">{currentSong.title}</h4>
              <p className="text-xs text-rose-200/90 font-medium truncate mt-0.5">{currentSong.artist || 'Curated with Love by Krishna'}</p>

          {/* Progress Bar */}

            <input 
              type="range"

              value={duration ? (progress / duration) * 100 : 0}

            <div className="flex justify-between text-[11px] text-rose-300 font-bold">

        const cleanFolder = folder.trim().replace(/^\/|\/$/g, '');
        const apiUrl = `https://api.github.com/repos/${cleanRepo}/contents/${cleanFolder}`;

        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error(`Folder "${cleanFolder}" not found in ${cleanRepo}`);

        const data = await res.json();
        if (!Array.isArray(data)) throw new Error(`Path ${cleanFolder} is not a directory.`);

        const validExts = ['.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg'];
        const imageFiles = data.filter(item => {
          const ext = item.name.substring(item.name.lastIndexOf('.')).toLowerCase();
          return validExts.includes(ext);
        });

        if (imageFiles.length > 0) {
          const fetchedPhotos = imageFiles.map((file, idx) => {
            const rawUrl = file.download_url || `https://raw.githubusercontent.com/${cleanRepo}/main/${cleanFolder}/${file.name}`;
            const titleClean = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
            const romanticTitle = titleClean.charAt(0).toUpperCase() + titleClean.slice(1);

            return {
              id: `gh-img-${idx}-${file.name}`,
              src: rawUrl,
              title: romanticTitle || `Soundarya & Krishna Memory #${idx + 1}`,
              tag: 'Soundarya & Krishna',

                          Create a folder named <code className="bg-rose-900 px-1.5 py-0.5 rounded font-mono text-white">Songs</code> in your GitHub repository and drop your <code className="font-mono">.mp3</code> files in it. They will automatically show up here!
                        </p>
                      </div>
                    ) : (
                      songs.map((song, idx) => (
                        <div 
                          key={song.id}
                          onClick={() => setCurrentSongIndex(idx)}
                          className={`p-4 rounded-2xl cursor-pointer transition-all flex items-center justify-between border ${
                            currentSongIndex === idx 
                              ? 'bg-rose-600/80 border-rose-400 text-white shadow-lg' 
                              : 'bg-rose-950/40 border-rose-800/30 text-rose-200 hover:bg-rose-900/40'
                          }`}
                        >
                          <div className="flex items-center gap-3">
                            <span className="text-xl">{currentSongIndex === idx ? '🎶' : '🎵'}</span>
                            <div>
                              <h5 className="font-bold text-sm md:text-base">{song.title}</h5>
                              <p className="text-xs text-rose-200/70">{song.artist}</p>
                            </div>
                          </div>

                          <span className="text-xs font-bold px-3 py-1 rounded-full bg-rose-900/60 border border-rose-500/30">
                            {currentSongIndex === idx ? 'Playing ▶' : 'Play'}
                          </span>
                        </div>
                      ))
                    )}
                  </div>
                </section>
              )}

              {/* TAB 4: ROMANTIC BAND STUDIO & CERTIFICATE */}
              {activeTab === 'band' && (
                <section className="space-y-8 animate-fadeIn max-w-3xl mx-auto">
                  <div className="text-center">
                    <h3 className="text-3xl font-bold font-serif text-white">Romantic Love Band Studio 🎀</h3>
                    <p className="text-rose-200/80 mt-2 text-sm">
                      Customize a beautiful romantic wristband for Soundarya and tie it onto our Lifetime Award!
                    </p>
                  </div>

                  <div className="glossy-panel p-6 md:p-8 rounded-3xl shadow-2xl space-y-6 border border-rose-400/20">
                    <div className="bg-slate-950/90 rounded-2xl p-8 text-center relative overflow-hidden flex flex-col items-center justify-center min-h-[180px] border border-rose-900/40">
                      <span className="text-xs font-bold text-amber-300 uppercase tracking-widest mb-3">Live Wristband Preview</span>

                      <div className="relative w-full max-w-sm flex items-center justify-center py-3">
                        <div className={`h-4 w-full rounded-full shadow-inner transition-all duration-500 ${
                          bandPattern === 'rose' ? 'bg-gradient-to-r from-rose-400 via-pink-500 to-rose-600' :
                          bandPattern === 'gold' ? 'bg-gradient-to-r from-amber-300 via-yellow-500 to-amber-600' :
                          bandPattern === 'teal' ? 'bg-gradient-to-r from-teal-400 via-emerald-500 to-cyan-500' :
                          'bg-gradient-to-r from-purple-500 via-pink-500 to-rose-500'
                        }`}></div>

                        <div className="absolute w-12 h-12 bg-white rounded-full shadow-lg border-2 border-amber-400 flex items-center justify-center text-2xl animate-bounce">
                          {bandCharm}
                        </div>
                      </div>

                      <p className="font-handwriting text-2xl text-white mt-4">
                        For: <span className="text-amber-300">{bandName || 'Soundarya'}</span>
                      </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                      <div>
                        <label className="block text-xs font-bold text-rose-200 uppercase mb-2">Soulmate's Name</label>
                        <input 
                          type="text" 
                          value={bandName} 
                          onChange={(e) => setBandName(e.target.value)}
                          className="w-full px-4 py-3 rounded-xl bg-rose-950/80 border border-rose-800 text-white font-semibold focus:outline-none focus:ring-2 focus:ring-rose-500"
                          placeholder="Enter name..."
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-rose-200 uppercase mb-2">Select Charm Icon</label>
                        <div className="flex gap-2">
                          {['💖', '⭐', '👑', '♾️', '💎', '🌸'].map((charm) => (
                            <button
                              key={charm}
                              onClick={() => setBandCharm(charm)}
                              className={`w-10 h-10 rounded-xl text-xl flex items-center justify-center border transition-all ${
                                bandCharm === charm ? 'bg-rose-600 text-white border-rose-400 scale-110 shadow-lg' : 'bg-rose-950/40 border-rose-800/40 hover:bg-rose-900/50'
                              }`}
                            >
                              {charm}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="md:col-span-2">
                        <label className="block text-xs font-bold text-rose-200 uppercase mb-2">Select Wristband Theme</label>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                          {[
                            { id: 'rose', label: 'Passionate Rose' },
                            { id: 'gold', label: 'Golden Love' },
                            { id: 'teal', label: 'Crystal Lagoon' },
                            { id: 'purple', label: 'Twilight Dream' }
                          ].map((p) => (
                            <button
                              key={p.id}
                              onClick={() => setBandPattern(p.id)}
                              className={`p-3 rounded-xl text-xs font-bold border transition-all ${
                                bandPattern === p.id ? 'bg-rose-600 text-white border-rose-400 shadow-lg' : 'bg-rose-950/40 text-rose-200 border-rose-800/40 hover:bg-rose-900/50'
                              }`}
                            >
                              {p.label}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>

                    <button
                      onClick={() => {
                        setIsBandTied(true);
                        triggerLoveShower();
                      }}
                      className="w-full py-4 glossy-btn text-white font-extrabold text-base rounded-2xl shadow-xl hover:scale-102 active:scale-98 transition-all flex items-center justify-center gap-2"
                    >
                      <span>🎀 Tie Romantic Band For Soundarya</span>
                    </button>
                  </div>

                  {/* OFFICIAL LIFETIME CERTIFICATE */}
                  <div className="bg-gradient-to-br from-amber-50 via-rose-50 to-pink-50 p-6 md:p-10 rounded-3xl border-8 border-double border-amber-400 shadow-2xl relative text-center text-slate-900 space-y-4">
                    <span className="text-xs font-black uppercase tracking-widest text-amber-900 bg-amber-200 px-4 py-1 rounded-full">
                      Official Lifetime Certificate
                    </span>

                    <h4 className="text-3xl md:text-4xl font-bold font-serif text-slate-900">
                      Best Soulmate & Best Friend Award
                    </h4>

                    <p className="text-sm text-slate-600 font-serif italic">This certificate proudly confirms that</p>

                    <p className="text-3xl md:text-4xl font-handwriting font-bold text-rose-700 underline decoration-amber-400 decoration-wavy">
                      {bandName || 'Soundarya'}
                    </p>

                    <p className="text-xs md:text-sm text-slate-700 max-w-md mx-auto leading-relaxed font-medium">
                      Is officially recognized as the most loving, irreplaceable, supportive, and precious soulmate to Krishna forever!
                    </p>

                    {isBandTied && (
                      <div className="py-2 animate-bounce">
                        <span className="inline-block px-4 py-1.5 bg-rose-100 text-rose-800 border border-rose-300 rounded-full font-bold text-xs">
                          🎀 Friendship Band Tied with {bandCharm} charm!
                        </span>
                      </div>
                    )}

                    <div className="pt-6 flex items-center justify-between border-t border-amber-200 text-xs font-bold text-slate-500">
                      <div>
                        <p className="font-serif text-slate-800">Soundarya & Krishna</p>
                        <p className="text-[10px]">Forever & Always</p>
                      </div>

                      <div className="w-16 h-16 bg-amber-400/20 rounded-full border-2 border-dashed border-amber-500 flex items-center justify-center text-amber-900 font-serif text-[10px] font-bold rotate-12">
                        SEAL OF LOVE
                      </div>

                      <div>
                        <p className="font-handwriting text-lg text-rose-700">Krishna ❤️</p>
                        <p className="text-[10px]">Authorized Signature</p>
                      </div>
                    </div>
                  </div>
                </section>
              )}

              {/* TAB 5: MEMORY MATCH GAME */}
              {activeTab === 'game' && (
                <section className="space-y-8 animate-fadeIn max-w-3xl mx-auto">
                  <div className="text-center">
                    <h3 className="text-3xl font-bold font-serif text-white">Memory Match Game 🎮</h3>
                    <p className="text-rose-200/80 mt-2 text-sm">
                      Soundarya, flip cards and match pairs of our photo memories!
                    </p>
                  </div>

                  <div className="flex items-center justify-between glossy-panel p-4 rounded-2xl border border-rose-400/20">
                    <div>
                      <span className="text-xs font-bold text-rose-300 uppercase">Moves</span>
                      <p className="text-xl font-extrabold text-white">{gameMoves}</p>
                    </div>
                    <div>
                      <span className="text-xs font-bold text-rose-300 uppercase">Matched Pairs</span>
                      <p className="text-xl font-extrabold text-amber-300">{matchedPairs.length / 2} / 6</p>
                    </div>
                    <button
                      onClick={initGame}
                      className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold text-xs transition-all shadow-md"
                    >
                      Restart 🔄
                    </button>
                  </div>

                  <div className="grid grid-cols-3 sm:grid-cols-4 gap-3">
                    {gameCards.map((card, idx) => {
                      const isFlipped = flippedGameCards.includes(idx) || matchedPairs.includes(idx);

                      return (
                        <div
                          key={card.gameId}
                          onClick={() => handleGameCardClick(idx)}
                          className={`aspect-square rounded-2xl cursor-pointer transition-all duration-300 transform perspective-1000 ${
                            isFlipped ? 'scale-100' : 'hover:scale-105 active:scale-95'
                          }`}
                        >
                          <div className={`w-full h-full rounded-2xl shadow-md border-2 transition-transform duration-500 transform-style-3d ${
                            isFlipped ? 'rotate-y-180 border-rose-400' : 'border-rose-500/40 bg-gradient-to-br from-rose-600 to-amber-500 flex items-center justify-center text-white text-3xl font-bold'
                          }`}>
                            {!isFlipped && <span>💖</span>}

                            {isFlipped && (
                              <div className="absolute inset-0 rounded-2xl overflow-hidden bg-slate-900 p-1">
                                <img 
                                  src={card.src} 
                                  alt="Match Card" 
                                  className="w-full h-full object-cover rounded-xl"
                                  onError={(e) => {
                                    e.target.onerror = null;
                                    e.target.src = 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=800&auto=format&fit=crop';
                                  }}
                                />
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {matchedPairs.length === gameCards.length && gameCards.length > 0 && (
                    <div className="bg-emerald-600 text-white p-6 rounded-3xl shadow-xl text-center animate-bounce">
                      <h4 className="text-2xl font-bold font-serif mb-1">Soundarya Matched All Memories! 🎉</h4>
                      <p className="text-sm text-emerald-100">Completed in {gameMoves} moves. You know our moments by heart!</p>
                    </div>
                  )}
                </section>
              )}

            </main>

            {/* GITHUB SYNC MODAL */}
            {isGithubModalOpen && (
              <div 
                className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn"
                onClick={() => setIsGithubModalOpen(false)}
              >
                <div 
                  className="bg-slate-900 text-white rounded-3xl p-6 md:p-8 max-w-lg w-full shadow-2xl relative border border-rose-500/30"
                  onClick={(e) => e.stopPropagation()}
                >
                  <button
                    onClick={() => setIsGithubModalOpen(false)}
                    className="absolute top-4 right-4 bg-rose-950 text-rose-300 hover:text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm border border-rose-800"
                  >
                    ✕
                  </button>

                  <div className="flex items-center gap-3 mb-4">
                    <span className="text-3xl">📁</span>
                    <div>
                      <h4 className="text-xl font-bold font-serif text-white">GitHub Folders Auto-Sync</h4>
                      <p className="text-xs text-rose-300">Automatically load photos from <code className="font-mono text-white">Photos</code> & songs from <code className="font-mono text-white">Songs</code>!</p>
                    </div>
                  </div>

                  <div className="space-y-3 text-xs text-rose-200 bg-rose-950/60 p-4 rounded-2xl border border-rose-800/40">
                    <p className="font-bold text-white">How Krishna can upload files on GitHub:</p>
                    <ol className="list-decimal list-inside space-y-1">
                      <li>Create folder <code className="bg-rose-900 px-1 py-0.5 rounded font-mono text-white">Photos</code> and upload your images (<code className="font-mono">.jpg, .png</code>).</li>
                      <li>Create folder <code className="bg-rose-900 px-1 py-0.5 rounded font-mono text-white">Songs</code> and upload your music (<code className="font-mono">.mp3, .wav</code>).</li>
                      <li>Enter your repository name below and click <strong>Sync Repository</strong>!</li>
                    </ol>
                  </div>

                  <div className="space-y-4 mt-4">
                    <div>
                      <label className="block text-xs font-bold uppercase text-rose-300 mb-1">GitHub Repo (username/repository)</label>
                      <input 
                        type="text" 
                        value={githubRepo}
                        onChange={(e) => setGithubRepo(e.target.value)}
                        placeholder="e.g. username/my-friendship-site"
                        className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-rose-800 focus:ring-2 focus:ring-rose-500 text-white font-semibold text-sm"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-bold uppercase text-rose-300 mb-1">Photos Folder</label>
                        <input 
                          type="text" 
                          value={photosFolder}
                          onChange={(e) => setPhotosFolder(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-rose-800 text-white text-xs font-mono"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-bold uppercase text-rose-300 mb-1">Songs Folder</label>
                        <input 
                          type="text" 
                          value={songsFolder}
                          onChange={(e) => setSongsFolder(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-rose-800 text-white text-xs font-mono"
                        />
                      </div>
                    </div>

                    {githubStatus && (
                      <div className={`p-3 rounded-xl text-xs font-bold ${
                        githubStatus.type === 'error' ? 'bg-rose-950 text-rose-200 border border-rose-800' :
                        githubStatus.type === 'success' ? 'bg-emerald-950 text-emerald-200 border border-emerald-800' :
                        'bg-sky-950 text-sky-200 border border-sky-800'
                      }`}>
                        {githubStatus.message}
                      </div>
                    )}

                    <div className="flex gap-3 pt-2">
                      <button
                        onClick={() => {
                          localStorage.setItem('bestie_romantic_repo', githubRepo);
                          syncGitHubData(githubRepo, photosFolder, songsFolder);
                        }}
                        disabled={isSyncingGithub}
                        className="flex-1 py-3 glossy-btn text-white font-bold rounded-xl shadow-lg transition-all text-xs flex items-center justify-center gap-2"
                      >
                        {isSyncingGithub ? <span>Syncing... ⏳</span> : <span>⚡ Sync Repository</span>}
                      </button>

                      <button
                        onClick={() => {
                          setPhotos(DEFAULT_PHOTOS);
                          setSongs([]);
                          setGithubStatus({ type: 'info', message: 'Reset to fallback dataset.' });
                        }}
                        className="px-4 py-3 bg-rose-950 text-rose-200 font-bold rounded-xl text-xs hover:bg-rose-900"
                      >
                        Reset
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* LIGHTBOX MODAL */}
            {selectedPhoto && (
              <div 
                className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn"
                onClick={() => setSelectedPhoto(null)}
              >
                <div 
                  className="bg-slate-900 rounded-3xl overflow-hidden max-w-2xl w-full shadow-2xl relative border border-rose-500/30"
                  onClick={(e) => e.stopPropagation()}
                >
                  <button
                    onClick={() => setSelectedPhoto(null)}
                    className="absolute top-4 right-4 bg-slate-950/80 text-white w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg z-10 hover:bg-slate-950"
                  >
                    ✕
                  </button>

                  <div className="max-h-[65vh] bg-black flex items-center justify-center overflow-hidden">
                    <img 
                      src={selectedPhoto.src} 
                      alt={selectedPhoto.title}
                      className="w-full h-full object-contain max-h-[65vh]"
                    />
                  </div>

                  <div className="p-6 text-white">
                    <span className="inline-block px-3 py-1 bg-rose-900 text-rose-200 rounded-full text-xs font-bold uppercase tracking-wider mb-2 border border-rose-700">
                      {selectedPhoto.tag}
                    </span>
                    <h4 className="text-2xl font-bold font-serif text-white mb-2">{selectedPhoto.title}</h4>
                    <p className="text-sm text-rose-200/80 mb-4">{selectedPhoto.caption}</p>

                    <div className="p-4 bg-rose-950/60 rounded-2xl border border-rose-800">
                      <p className="font-handwriting text-2xl text-rose-200">
                        "{selectedPhoto.note}"
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* HEARTFELT LETTER MODAL */}
            {isLetterOpen && (
              <div 
                className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn"
                onClick={() => setIsLetterOpen(false)}
              >
                <div 
                  className="bg-gradient-to-br from-amber-50 via-rose-50 to-pink-50 rounded-3xl p-6 md:p-10 max-w-xl w-full shadow-2xl border-4 border-rose-400 relative text-slate-900"
                  onClick={(e) => e.stopPropagation()}
                >
                  <button
                    onClick={() => setIsLetterOpen(false)}
                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-xl font-bold"
                  >
                    ✕
                  </button>

                  <div className="text-center mb-6">
                    <span className="text-4xl">💌</span>
                    <h4 className="text-2xl font-bold font-serif text-rose-900 mt-2">To My Dearest Soundarya</h4>
                    <p className="text-xs font-semibold text-rose-600">From Krishna, With All My Heart</p>
                  </div>

                  <div className="space-y-4 font-handwriting text-2xl text-slate-800 leading-snug max-h-[50vh] overflow-y-auto pr-2">
                    <p>My Dearest Soundarya,</p>
                    <p>
                      Looking at all these pictures and listening to our songs brings a warm, glowing smile to my face. Having you in my life as my best friend and soulmate is the greatest blessing I could ever ask for.
                    </p>
                    <p>
                      Thank you for your infinite patience, your sweet laughter, and for being the safest, most comforting presence in Krishna’s world.
                    </p>
                    <p>
                      Here’s to making a trillion more memories together, listening to our favorite songs, and staying by each other's side forever!
                    </p>
                    <p className="text-right text-rose-700 pt-2 font-bold">
                      With all my love, ❤️<br />
                      Krishna
                    </p>
                  </div>

                  <div className="mt-8 text-center">
                    <button
                      onClick={() => {
                        setIsLetterOpen(false);
                        triggerLoveShower();
                      }}
                      className="px-6 py-3 glossy-btn text-white font-bold rounded-xl shadow-lg hover:scale-105 active:scale-95 transition-all text-sm"
                    >
                      💖 Send Hug Back to Krishna
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* FOOTER */}
            <footer className="glossy-panel border-t border-rose-900/40 py-8 text-center text-xs text-rose-300">
              <p className="font-semibold text-rose-200">Crafted with ❤️ for Soundarya by Krishna</p>
              <p className="mt-1 text-rose-400/80">Forever & Always Beyond Words ✨</p>
            </footer>

          </div>
        </div>
      );
    }

    // Render React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
